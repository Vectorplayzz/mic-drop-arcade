# betamicdrop.ourspaces.net -- internal testing copy of the game until launch (same API).
# At launch this is replaced by betamicdrop-redirect.conf.
server {
    listen 80;
    listen [::]:80;
    server_name betamicdrop.ourspaces.net;
    return 301 https://$host$request_uri;
}

server {
    # 'listen ... http2' works on nginx 1.24 (Ubuntu 24.04); on >= 1.25 use 'http2 on;'.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name betamicdrop.ourspaces.net;

    ssl_certificate     /etc/letsencrypt/live/betamicdrop.ourspaces.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/betamicdrop.ourspaces.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:maata_ssl:10m;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn maata_conn 20;

    # --- Static PWA (the game client build) -------------------------------------------
    root /var/www/maata/client;
    index index.html;

    include /etc/nginx/snippets/maata-security-headers-beta.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|webp|svg|woff2|ogg|mp3|json)$ {
        expires 7d;
        include /etc/nginx/snippets/maata-security-headers-beta.conf;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/maata-security-headers-beta.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        include /etc/nginx/snippets/maata-security-headers-beta.conf;
        add_header Cache-Control "no-cache" always;
    }

    # --- API ----------------------------------------------------------------------------
    location /api/ {
        limit_req zone=maata_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;      # client IP after real_ip from Cloudflare
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
        proxy_hide_header X-Powered-By;
    }

    location /api/docs { return 404; }

    # --- Game socket --------------------------------------------------------------------
    location = /ws/play {
        limit_req zone=maata_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 120s;   # server pings every 20 s; game sessions stay open
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
