# micdrop.ourspaces.net -- PRE-LAUNCH countdown page (until 10 Oct 2026 00:00 IST).
# Static files only: no API, no game socket.
server {
    listen 80;
    listen [::]:80;
    server_name micdrop.ourspaces.net;
    return 301 https://$host$request_uri;
}

server {
    # 'listen ... http2' works on nginx 1.24 (Ubuntu 24.04); on >= 1.25 use 'http2 on;'.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name micdrop.ourspaces.net;

    ssl_certificate     /etc/letsencrypt/live/micdrop.ourspaces.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/micdrop.ourspaces.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:maata_ssl:10m;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn maata_conn 20;

    root /var/www/maata/prelaunch;
    index index.html;

    include /etc/nginx/snippets/maata-prelaunch-headers.conf;

    location / {
        try_files $uri /index.html;
    }

    # Retires the game's service worker in browsers that opened the game here earlier.
    location = /sw.js {
        include /etc/nginx/snippets/maata-prelaunch-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        include /etc/nginx/snippets/maata-prelaunch-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/(api|ws)/ {
        default_type application/json;
        return 503 '{"error":"not_launched","detail":"Mic Drop Arcade opens on 10 Oct 2026, 00:00 IST."}';
    }
}
