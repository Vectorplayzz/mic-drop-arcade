# /etc/nginx/conf.d/maata-zones.conf -- shared by every Mic Drop site (live, pre-launch, beta).
limit_req_zone  $binary_remote_addr zone=maata_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=maata_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
