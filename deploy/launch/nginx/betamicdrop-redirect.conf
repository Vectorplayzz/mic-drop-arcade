# betamicdrop.ourspaces.net -- AFTER LAUNCH: everything goes to the live site.
# /sw.js stays here (200, not a redirect) so testers' browsers can swap the game's service
# worker for the one that retires it; a redirected worker script can't update.
server {
    listen 80;
    listen [::]:80;
    server_name betamicdrop.ourspaces.net;
    return 301 https://micdrop.ourspaces.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name betamicdrop.ourspaces.net;

    ssl_certificate     /etc/letsencrypt/live/betamicdrop.ourspaces.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/betamicdrop.ourspaces.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:maata_ssl:10m;
    server_tokens off;

    location = /sw.js {
        root /var/www/maata/retire;
        default_type application/javascript;
        try_files /sw.js =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 301 https://micdrop.ourspaces.net$request_uri;
    }
}
