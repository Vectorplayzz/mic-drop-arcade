# /etc/nginx/sites-available/micdrop.ourspaces.net  (symlink into sites-enabled)
# Cloudflare (proxied, SSL mode "Full (strict)") -> nginx (origin cert) -> 127.0.0.1:8088 (api)
# Requires: include of cloudflare-realip.conf in the http{} block (see DEPLOY.md).

limit_req_zone  $binary_remote_addr zone=maata_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=maata_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name micdrop.ourspaces.net;
    return 301 https://$host$request_uri;
}

server {
    # 'listen ... http2' works on nginx 1.24 (Ubuntu 24.04); on >= 1.25 use 'http2 on;'.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name micdrop.ourspaces.net;

    ssl_certificate     /etc/ssl/cloudflare/ourspaces.net.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ourspaces.net.key;
    # Authenticated origin pulls: only Cloudflare can complete the TLS handshake.
    ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:maata_ssl:10m;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn maata_conn 20;

    # --- Static PWA (Devesh's client build) -------------------------------------------
    root /var/www/maata/client;
    index index.html;

    include /etc/nginx/snippets/maata-security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|webp|svg|woff2|ogg|mp3|json)$ {
        expires 7d;
        include /etc/nginx/snippets/maata-security-headers.conf;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/maata-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        include /etc/nginx/snippets/maata-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # --- API ----------------------------------------------------------------------------
    location /api/ {
        limit_req zone=maata_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;      # client IP after real_ip from Cloudflare
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
        proxy_hide_header X-Powered-By;
    }

    location /api/docs { return 404; }

    # --- Game socket --------------------------------------------------------------------
    location = /ws/play {
        limit_req zone=maata_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 120s;   # server pings every 20 s; game sessions stay open
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
