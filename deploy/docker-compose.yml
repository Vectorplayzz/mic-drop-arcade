# Mic Drop Arcade production stack. Run from this directory on the VPS:
#   docker compose --env-file .env up -d
# Only the API is published, and only on the host's loopback for nginx.

name: maata

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  api:
    <<: *hardening
    image: maata-arcade-api:${MAATA_TAG:-latest}
    build: { context: ../server }
    env_file: .env
    environment:
      MAATA_ENV: production
      MAATA_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MAATA_DATABASE_URL: postgresql://maata:${POSTGRES_PASSWORD}@postgres:5432/maata
      # nginx reaches the container through the bridge gateway of the 'edge' network.
      MAATA_TRUSTED_PROXIES: 172.31.240.1/32,127.0.0.1/32
    ports: ["127.0.0.1:8088:8000"]
    read_only: true
    # Longer than uvicorn's --timeout-graceful-shutdown (20 s) so games can close cleanly.
    stop_grace_period: 30s
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes: ["audio:/data/audio"]
    cap_drop: [ALL]
    mem_limit: 768m
    pids_limit: 256
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [edge, internal]

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --save 300 10
      --maxmemory 128mb --maxmemory-policy noeviction --protected-mode yes
    volumes: ["redis:/data"]
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }
    networks: [internal]

  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maata
      POSTGRES_DB: maata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes: ["pgdata:/var/lib/postgresql/data"]
    mem_limit: 384m
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maata -d maata"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

networks:
  edge:
    ipam:
      config: [{ subnet: 172.31.240.0/24, gateway: 172.31.240.1 }]
  internal:
    internal: true  # no route to the internet; Redis and Postgres are unreachable from outside

volumes:
  audio:
  redis:
  pgdata:
